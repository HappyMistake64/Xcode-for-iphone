name: Pocket Build Manager tests
on:
  push:
    paths:
      - 'native-build/build_manager.py'
      - 'tests/test_build_manager.py'
      - '.github/workflows/pocket-build-manager-tests.yml'
  pull_request:
    paths:
      - 'native-build/build_manager.py'
      - 'tests/test_build_manager.py'
      - '.github/workflows/pocket-build-manager-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline state and identity tests
        run: python3 -m unittest discover -s tests -v
