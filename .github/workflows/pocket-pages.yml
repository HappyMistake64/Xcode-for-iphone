name: Publish Xcode Pocket iPhone editor
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pocket-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: xcode-pocket-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publish website
        id: publish
        uses: actions/deploy-pages@v4
