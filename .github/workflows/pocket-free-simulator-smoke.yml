              types = [d for d in inventory.get('devicetypes', []) if d.get('productFamily') == 'iPhone' and isinstance(d.get('identifier'), str) and re.fullmatch(r'com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+', d['identifier'])]
              if runtime_id:
